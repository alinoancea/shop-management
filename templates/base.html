<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} – Configurare Magazin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='app.css') }}" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="shell">
        <aside class="sidebar">
            <a class="brand" href="{{ url_for('produse') }}">
                <span class="brand-badge"><i class="bi bi-shop"></i></span>
                <span class="brand-text">
                    <span class="brand-title">Configurare Magazin</span>
                    <span class="brand-sub" id="brandStore">{{ store_name }}</span>
                </span>
            </a>
            <nav class="side-nav">
                <a class="side-link {{ 'active' if request.endpoint == 'produse' }}" href="{{ url_for('produse') }}">
                    <i class="bi bi-upc-scan"></i> Verificare produse
                </a>
                <a class="side-link {{ 'active' if request.endpoint == 'game' }}" href="{{ url_for('game') }}">
                    <i class="bi bi-tags"></i> Configurare game
                </a>
                <a class="side-link {{ 'active' if request.endpoint == 'ecrane' }}" href="{{ url_for('ecrane') }}">
                    <i class="bi bi-display"></i> Configurare ecrane
                </a>
                <a class="side-link {{ 'active' if request.endpoint == 'settings_page' }}" href="{{ url_for('settings_page') }}">
                    <i class="bi bi-gear"></i> Setări
                </a>
            </nav>
            <div class="side-foot">v{{ app_version }}</div>
        </aside>
        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <div class="toast-container" id="toastContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
